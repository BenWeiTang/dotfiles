# Bind r to re-source this config file
unbind r
bind r source-file "~/.config/tmux/tmux.conf"

# Bind prefix to `
unbind C-b
set -g prefix `
bind ` send-prefix

# Pane-selection keybinds
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# 1-based indexing
set -g base-index 1
set -g pane-base-index 1

# True color support
set -sg terminal-overrides ",*:RGB"

# Status bar
set -g status-position top
set -g status-style "bg=default,fg=black"
set -g status-left ""
set -g status-right "#[fg=darkgray,nobold]#S"

# Window buttons
set -g window-status-format "●"
set -g window-status-current-format "●"
set -g window-status-style "fg=darkgray"
set -g window-status-current-style "#{?window_zoomed_flag,fg=grey,fg=BrightBlue\#,nobold}"
set -g window-status-bell-style "fg=red,nobold"

# QoL
set -g renumber-windows on
set -g escape-time 0
set -g mouse on
