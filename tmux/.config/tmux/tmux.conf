# Bind r to re-source this config file
unbind r
bind r source-file "~/.config/tmux/tmux.conf"

# Bind prefix to `
unbind C-b
set -g prefix `
bind ` send-prefix

# Pane-selection keybinds
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane-split keybinds
unbind %
unbind '"'
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 1-based indexing
set -g base-index 1
set -g pane-base-index 1

# True color support
set -g default-terminal "tmux-256color"
set -sg terminal-overrides ",xterm*:RGB"

# Status bar
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default,fg=black"
set -g status-left ""
set -g status-right "#[fg=darkgray,nobold]#S"

# Window buttons
set -g window-status-format "●"
set -g window-status-current-format "●"
set -g window-status-style "fg=DarkGray"
set -g window-status-current-style "fg=BrightBlue"
set -g window-status-bell-style "fg=red,nobold"

# Open new windows in the current working directory
bind c new-window -c "#{pane_current_path}"

# QoL
set -g renumber-windows on
set -g escape-time 0
set -g mouse on
